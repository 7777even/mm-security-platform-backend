name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试（Maven / JDK 17）
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 注意：本地开发用 `mvn -s ci-settings.xml`，但该文件把 localRepository 硬编码为
      # Windows 路径 C:/Users/7even/.m2/repository，在 Linux runner 上不可用。
      # CI 因此使用 Maven 默认 settings，依赖缓存交由 setup-java 的 cache: maven 负责。
      # mvn test 已绑定 jacoco 的 prepare-agent / report / check，
      # 行覆盖率跌破 pom 中 jacoco.line.coverage.min 时构建失败（覆盖率门禁）
      - name: 运行单元测试 + 覆盖率门禁
        run: mvn -B -ntp test

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  contract-guard:
    name: 跨库 API 契约守门（路由 + schema 字段级）
    runs-on: ubuntu-latest
    steps:
      - name: 检出后端源码（实现侧）
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 契约机器可读真源在前端仓 frontend-scaffold/docs/api，后端禁止复制第二份。
      # 这里只稀疏拉取 docs/api 目录做对拍，避免全量克隆。
      # 若前端仓为私有：在本仓 Settings → Secrets 配置 CONTRACT_REPO_TOKEN
      # （PAT，需具备前端仓的读权限）；公开仓无需配置，回退到默认 GITHUB_TOKEN 即可。
      - name: 检出前端契约真源（跨仓，仅 docs/api）
        uses: actions/checkout@v4
        with:
          repository: 7777even/mm-security-platform-scaffold
          ref: feature/scaffold-rebuild
          path: frontend-scaffold
          sparse-checkout: docs/api
          sparse-checkout-cone-mode: false
          token: ${{ secrets.CONTRACT_REPO_TOKEN || github.token }}

      - name: 契约对拍（strict：路由差异或 schema 漂移任一 > 0 即失败）
        run: node scripts/check-api-contract.mjs --contracts frontend-scaffold/docs/api --strict

      # 本 job 对拍的是前端仓契约的「分支最新」，因此存在时序耦合：
      # 契约侧还没推送时，后端实现无论对错都会红。这里把排查方向写清楚，
      # 避免后端同学误以为是实现缺陷。
      - name: 失败排查指引
        if: failure()
        run: |
          echo "::error::路由或 schema 与前端契约不一致。先判定漂移来自哪一侧："
          echo "  · 输出格式为「字段:契约≠后端」，左侧是前端契约、右侧是本仓实现。"
          echo "  · 批量出现 object≠string 时，先怀疑契约用了 OpenAPI 3.1 联合类型"
          echo "    \"type\": [\"string\",\"null\"] 而守门脚本未识别 —— 是脚本缺陷，不是实现漂移。"
          echo "  · 若确认要改契约：必须在前端仓改 docs/api/<domain>.openapi.json 并**先推送**，"
          echo "    再重跑本 job（本 job 拉取的是前端仓分支最新，不认本地改动）。"
          echo "  · 前端仓已新增同名 contract-guard job，可直接在那里先验证契约侧是否自洽。"
          echo "  详见根 AGENTS.md §4「跨库推送顺序」。"

      # openspec 闭环纪律守门：changes/ 下不允许存在 tasks 全勾未归档的 Change、
      # 四件套缺失、archive/ 目录缺日期前缀（规则见根 AGENTS.md §7.1）。
      - name: OpenSpec 卫生检查（全勾必归档）
        run: node scripts/check-openspec-hygiene.mjs
