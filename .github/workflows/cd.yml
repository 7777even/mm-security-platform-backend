name: Backend CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: 构建并推送镜像（GHCR）
    runs-on: ubuntu-latest
    # 推送 GHCR 需要 packages 写权限（使用默认 GITHUB_TOKEN）
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 测试由 ci.yml 的 test job 负责；此处只产出镜像（与 Dockerfile 一致 skipTests）
      - name: 构建 jar
        run: mvn -B -ntp package -DskipTests

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # 默认 profile（H2 / PostgreSQL）。达梦 dm 镜像需先在构建机
          # install DmJdbcDriver18.jar（受授权限制，不随镜像分发），此处不自动构建 dm 变体。
