# =============================================================================
# mm-security-backend K8s Secret 模板
#
# 请勿将明文提交进仓库。实际部署任选其一：
#   1) kubectl create secret generic mm-security-backend \
#        --from-literal=JWT_SECRET=xxx \
#        --from-literal=SIGNATURE_SECRET=xxx \
#        --from-literal=DB_PASSWORD=xxx \
#        --from-literal=DB_USERNAME=SYSDBA
#   2) sealed-secrets / external-secrets / Vault 注入（推荐生产）
#
# backend.yaml 通过 secretRef: name=mm-security-backend 挂载以下键。
# 本文件仅作字段说明占位，部署前请用上面命令替换。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mm-security-backend
  labels:
    app: mm-security-backend
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_256BIT_RANDOM"
  SIGNATURE_SECRET: "REPLACE_WITH_256BIT_RANDOM"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DB_USERNAME: "SYSDBA"
