server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mm-security-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/mm_security
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:mm-security-backend-secret-key-change-in-production-min-256-bits}
  # access token 有效期（秒）= 2h
  access-ttl: 7200
  # refresh token 有效期（秒）= 7d
  refresh-ttl: 604800
  issuer: mm-security-backend

# 防重放签名（生产环境启用 HMAC-SHA256，dev/gateway-bypass 可挂起）
signature:
  enabled: ${SIGNATURE_ENABLED:false}
  secret: ${SIGNATURE_SECRET:sign-secret-change-in-production}
  # timestamp 容忍偏差（秒）= 5min
  max-skew-seconds: 300

# 日志
logging:
  level:
    root: INFO
    com.sinopec.mmsecurity: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sinopec.mmsecurity.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# =============================================================================
# Actuator 可观测性（健康/就绪/存活/信息探针）
#   - 暴露 health、info 两个 Web 端点；health 下含 /liveness 与 /readiness 子探针
#     （probes.enabled=true，供 K8s startupProbe/readinessProbe/livenessProbe）
#   - show-details=when_authorized：匿名探针只拿到 UP/DOWN 状态，鉴权后可看组件明细，
#     避免把数据源等内部细节暴露给公网
#   - /actuator/** 已在 JwtFilter/HmacFilter 白名单放行，探针免 JWT/免签名
#   - 注意：探针路径是 /actuator/health（非既有自定义 /api/v1/health）
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: mm-security-backend
    description: 石化园区安全风险管控平台后端服务

