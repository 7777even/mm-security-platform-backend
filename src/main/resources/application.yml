server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mm-security-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/mm_security
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  # 数据库版本化迁移（Flyway）：接管建表职责，不再由 spring.sql.init 加载 schema.sql/data.sql。
  # 双轨策略：V1 全量快照（空库直达最新）+ V<yyyyMMddHHmmss>__<snake>.sql 增量；
  # 已进共享环境的 V 文件禁止修改 / 重命名 / 删除（AGENTS.md §数据库）。
  # locations 按 profile 覆盖：dev -> h2（本地可验证）、prod -> postgresql、dm -> dameng。
  sql:
    init:
      enabled: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration/h2
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false

# JWT 配置
# 注意：jwt.secret 不得在此提供默认占位值——任何默认都会让「忘记注入真实密钥」的上线带着弱密钥运行。
# 生产/信创（prod/dm）已声明为 ${JWT_SECRET}（无默认，缺失即启动失败）；dev profile 单独给定 dev 密钥。
jwt:
  secret: ${JWT_SECRET}
  # access token 有效期（秒）= 2h
  access-ttl: 7200
  # refresh token 有效期（秒）= 7d
  refresh-ttl: 604800
  issuer: mm-security-backend

# 防重放签名（生产环境启用 HMAC-SHA256，dev/gateway-bypass 可挂起）
# signature.secret 同理不得提供默认占位；prod/dm 为 ${SIGNATURE_SECRET}（无默认），dev 单独给定。
signature:
  enabled: ${SIGNATURE_ENABLED:false}
  secret: ${SIGNATURE_SECRET}
  # timestamp 容忍偏差（秒）= 5min
  max-skew-seconds: 300

# 日志
logging:
  level:
    root: INFO
    com.sinopec.mmsecurity: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sinopec.mmsecurity.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# =============================================================================
# Actuator 可观测性（健康/就绪/存活/信息探针）
#   - 暴露 health、info 两个 Web 端点；health 下含 /liveness 与 /readiness 子探针
#     （probes.enabled=true，供 K8s startupProbe/readinessProbe/livenessProbe）
#   - show-details=when_authorized：匿名探针只拿到 UP/DOWN 状态，鉴权后可看组件明细，
#     避免把数据源等内部细节暴露给公网
#   - /actuator/** 已在 JwtFilter/HmacFilter 白名单放行，探针免 JWT/免签名
#   - 注意：探针统一走 /actuator/health；自定义 /api/v1/health 已废弃删除（2026-09-08）
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: mm-security-backend
    description: 石化园区安全风险管控平台后端服务

