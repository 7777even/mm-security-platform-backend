server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mm-security-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/mm_security
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false

# JWT 配置
jwt:
  secret: ${JWT_SECRET:mm-security-backend-secret-key-change-in-production-min-256-bits}
  # access token 有效期（秒）= 2h
  access-ttl: 7200
  # refresh token 有效期（秒）= 7d
  refresh-ttl: 604800
  issuer: mm-security-backend

# 防重放签名（生产环境启用 HMAC-SHA256，dev/gateway-bypass 可挂起）
signature:
  enabled: ${SIGNATURE_ENABLED:false}
  secret: ${SIGNATURE_SECRET:sign-secret-change-in-production}
  # timestamp 容忍偏差（秒）= 5min
  max-skew-seconds: 300

# 日志
logging:
  level:
    root: INFO
    com.sinopec.mmsecurity: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sinopec.mmsecurity.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
