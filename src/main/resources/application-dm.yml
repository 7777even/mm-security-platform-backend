# =============================================================================
# 达梦 DM8 生产环境配置（--spring.profiles.active=dm 激活）
#
# 【状态：2026-09-17 迁移已在真实 DM8 实例实跑通过 —— 此前"本机无实例"的描述已过期】
#   本机已装达梦 DM8 开发版（D:\dameng，实例数据目录 D:\dameng\data\DAMENG，监听 5236）。
#   db/migration/dameng 的 V1–V57 已用 disql 逐文件实跑：错误码 0、建表 140、中文往返正确
#   （执行器 scripts/verify-dameng-migration.cmd；结论见 docs/deployment/dameng-migration-runbook.md §5）。
#   仍未闭合：① Flyway 集成本身 —— 社区版与商业版均不内置达梦 database 模块，需第三方模块或
#   自实现 DatabaseType SPI；② 以 --spring.profiles.active=dm 启动后的端到端冒烟。
#   驱动 jar 不在中央仓库，须先 install-file；本机验证可直接用达梦自带 drivers/jdbc/DmJdbcDriver11.jar。
#
# 信创国产化选定生产库（设计稿意图）。本 profile 与 prod(PostgreSQL) 同构的安全基线，
# 仅数据源与 Flyway 迁移方言不同。
#
# 启用前置条件（本机无达梦实例，以下为到环境上的操作）：
#   1. 安装达梦 JDBC 驱动到本地 Maven 仓库（驱动 jar 不在中央仓库）：
#        mvn install:install-file -Dfile=DmJdbcDriver18.jar \
#            -DgroupId=com.dameng -DartifactId=DmJdbcDriver18 -Dversion=8.1.3 -Dpackaging=jar
#      pom.xml 的 <profiles><dm> 已声明该依赖（仅在 dm profile 激活时解析，不影响 dev/默认构建）。
#   2. Flyway 社区版无官方达梦 database 模块，迁移 SQL（db/migration/dameng）按 DM8(Oracle 兼容)
#      方言编写，须在达梦实例上复核执行；若 Flyway 报「Unsupported Database」，需引入达梦兼容的
#      Flyway database 插件，或将 Flyway 的数据库探测配置为兼容模式后重试。
#
# 安全基线（与 prod 一致）：防重放签名强制开启、JWT_SECRET 必须注入、关闭 H2 Console、关闭 SQL 打印、CORS 显式白名单。
# =============================================================================

spring:
  datasource:
    # ⚠️ 达梦「用户 = 模式(schema)」：JDBC URL 里的路径段会被当作【模式名】解析，
    #   写成 jdbc:dm://host:5236/mm_security 会直接报「无效的模式名[mm_security]」
    #   （2026-09-17 真机实测；H2/PG 无此语义，故本地一直未暴露）。
    #   因此 URL 不写路径段，schema 由 DB_USERNAME 决定（默认 SYSDBA 即 SYSDBA 模式）。
    url: jdbc:dm://${DB_HOST:localhost}:${DB_PORT:5236}
    username: ${DB_USERNAME:SYSDBA}
    password: ${DB_PASSWORD}
    driver-class-name: dm.jdbc.driver.DmDriver
  h2:
    console:
      enabled: false
  # Flyway 迁移位置：达梦 DM8 方言（classpath:db/migration/dameng）。
  flyway:
    locations: classpath:db/migration/dameng
    # ⚠️ 必须把 baseline 版本设为 0。原因：达梦实例恒自带系统表（如 ##HISTOGRAMS_TABLE），
    #    在继承 application.yml 的 baseline-on-migrate=true 时，Flyway 会判定「schema 非空」
    #    并按默认 baselineVersion=1 打基线 ⇒ **V1__init_schema.sql 被整份跳过**，而 V2 的种子
    #    又要往 sys_menu 写入 ⇒ 报 `-2104 无效的表名[sys_menu]`（2026-09-17 真机实测）。
    #    H2/PG 的库是真空的，因此该问题本地长年未暴露。
    #    设 baseline-version=0 后基线落在 0，V1 起全部按序执行。
    baseline-version: 0

# JWT：生产必须注入 JWT_SECRET（≥ 256bit），无默认值
jwt:
  secret: ${JWT_SECRET}

# 防重放签名：生产强制开启
signature:
  enabled: true
  secret: ${SIGNATURE_SECRET}

# CORS：生产必须显式注入白名单（覆盖 dev 的 localhost 默认）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # 生产 HTTPS（信创）：刷新 Cookie 须 Secure 才生效（HttpOnly + SameSite=Lax 已由代码固定）
  cookie:
    secure: true

# 日志：生产收紧到 INFO
logging:
  level:
    root: INFO
    com.sinopec.mmsecurity: INFO
    org.springframework.web: INFO

# 关闭 SQL 打印
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
