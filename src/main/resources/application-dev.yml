# 开发环境：启用 H2 内存库兜底（无需本地 PostgreSQL 即可启动）
spring:
  datasource:
    url: jdbc:h2:mem:mm_security;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: embedded
      # 强制脚本以 UTF-8 读取：中文 Windows 下 JVM 默认字符集为 GBK，
      # 若不显式指定，data.sql 内的中文会被按 GBK 解码而乱码。
      encoding: UTF-8

jwt:
  secret: dev-secret-not-for-production-please-change-me-please-please

signature:
  enabled: false

logging:
  level:
    com.sinopec.mmsecurity: TRACE
