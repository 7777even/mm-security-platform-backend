# 开发环境：启用 H2 内存库兜底（无需本地 PostgreSQL 即可启动）
server:
  # 端口对齐前端脚手架 .env.development 的 VITE_API_BASE（localhost:8787），
  # 前端 dev 关掉 mock 后即可直连本后端，无需额外改前端配置。
  port: 8787
spring:
  datasource:
    url: jdbc:h2:mem:mm_security;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  # 建表改由 Flyway 接管（spring.sql.init.enabled 已在 application.yml 全局关闭）。
  # 迁移脚本位置：classpath:db/migration/h2（继承自 application.yml base，dev 即 H2 方言）。
  # Flyway 默认编码 UTF-8，中文脚本在中文 Windows 下不会乱码。

# 开发期 CORS：前端 dev server 端口由 vite 动态分配（5173/5174/5175…），
# 用通配来源（allowedOriginPatterns("*") + allowCredentials）兼容任意 localhost 端口，
# 避免再加白名单。生产环境务必在 application-prod.yml / application-dm.yml 注入真实域名白名单。
app:
  cors:
    allowed-origins: "*"

jwt:
  secret: dev-secret-not-for-production-please-change-me-please-please

signature:
  enabled: false

logging:
  level:
    com.sinopec.mmsecurity: TRACE
