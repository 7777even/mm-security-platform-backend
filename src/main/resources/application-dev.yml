# 开发环境：启用 H2 内存库兜底（无需本地 PostgreSQL 即可启动）
server:
  # 端口对齐前端脚手架 .env.development 的 VITE_API_BASE（localhost:8787），
  # 前端 dev 关掉 mock 后即可直连本后端，无需额外改前端配置。
  port: 8787
spring:
  datasource:
    # dev 由「内存库」改为「文件库」：新增的业务数据（如应急事件）随进程重启保留，
    # 不再每次启动清零。库文件位置 backend-scaffold/data/mm_security_dev.mv.db（已 gitignore）。
    # AUTO_SERVER=TRUE 允许多进程（dev 服务 + H2 Console + 外部工具）共享同一份物理库，
    # 避免「database already in use」锁错；库文件由 Flyway 在首次启动时建表并灌种子。
    url: jdbc:h2:file:./data/mm_security_dev;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  # 建表改由 Flyway 接管（spring.sql.init.enabled 已在 application.yml 全局关闭）。
  # 迁移脚本位置：classpath:db/migration/h2（继承自 application.yml base，dev 即 H2 方言）。
  # Flyway 默认编码 UTF-8，中文脚本在中文 Windows 下不会乱码。

# 开发期 CORS：前端 dev server 端口由 vite 动态分配（5173/5174/5175…），
# 用通配来源（allowedOriginPatterns("*") + allowCredentials）兼容任意 localhost 端口，
# 避免再加白名单。生产环境务必在 application-prod.yml / application-dm.yml 注入真实域名白名单。
app:
  cors:
    allowed-origins: "*"
  password:
    # dev 用 H2 文件库（重启保留数据，不再每次清空重建）；若种子默认管理员置 must_change_pwd=1，
    # 则启动后首次必须改密才能进行任何写操作，会反复阻断演示与联调。
    # 故 dev 不置该标记；生产（prod/dm）沿用 base 默认 true，由 PasswordLifecycleInterceptor
    # 在业务写端点强制拦截未改密账号。拦截器本身在任何 profile 都启用。
    force-change-default-admin: false

jwt:
  secret: dev-secret-not-for-production-please-change-me-please-please

signature:
  enabled: false
  # dev 签名挂起，但占位密钥仍需给定以便配置绑定（绝不用于生产）
  secret: dev-sign-secret-not-for-production-please-change-me

logging:
  level:
    com.sinopec.mmsecurity: TRACE

# 开发期关闭 OpenTelemetry OTLP 导出：本机无 OTel Collector(:4317)，
# 若不关闭会每 ~10s 刷一批 "Failed to export spans ... Connection refused" 噪声（非致命，但刷屏）。
# 仅作用于 dev profile；生产(prod/dm)仍走 application.yml 的 OTLP 导出，
# 部署时须将 application.yml 的 http://localhost:4317 改为真实 Collector 内网地址。
management:
  tracing:
    enabled: false

# =============================================================================
# ABAC 实时广播防区映射（零下行权限控制闭环的配置注入点）
#   - 代码不硬编码任何映射（AGENTS §11.3）；location → 防区 语义由本配置提供。
#   - 业务库 location 多为自由文本（如 "炼油区-催化裂化装置西侧"），故 dev 用 contains 模式按
#     「防区名作为子串」命中，避免逐条精确枚举；未命中仍 fail-open（推全部已认证会话）。
#   - location-to-zones 的键覆盖 sys_zone.zone_name 全部 16 个防区（V34+V46+V49 种子），
#     值须与 zone_name 严格对齐；aliases 把同义表述兜底映射到对应防区。
#   - 生产环境由产品/运维按真实 location→防区 语义填充本段（勿提交业务硬编码）；
#     产品确认规则前此段即为「推荐默认实现」，后续按确认结果调整。
# =============================================================================
abac:
  zone-mapping:
    match-mode: contains
    # 推荐默认映射（产品确认真实 location→防区 语义前即以此为准；后续按确认结果仅改本段、不改代码）。
    # 上半部 16 个防区自映射为权威键（值须严格对齐 sys_zone.zone_name，V34+V46+V49 种子）。
    # 下半部为基于 H2 dev 真实 location 自由文本取样补的子区域关键词（contains 最长键优先命中）；
    #   书写顺序已按「精确子防区优先于泛化父防区」排布（如 罐区A 先于 储罐区、化工区 先于 乙烯区）。
    location-to-zones:
      # —— 16 防区权威键（与 sys_zone.zone_name 严格对齐）——
      炼油区: [炼油区]
      乙烯区: [乙烯区]
      罐区: [罐区]
      罐区A: [罐区A]
      罐区B: [罐区B]
      仓储区: [仓储区]
      码头区: [码头区]
      芳烃区: [芳烃区]
      特勤保障区: [特勤保障区]
      危化仓库: [危化仓库]
      装卸区: [装卸区]
      装置C: [装置C]
      全厂范围: [全厂范围]
      化工区: [化工区]
      储运区: [储运区]
      公用工程区: [公用工程区]
      # —— 子区域自由文本关键词 → 父防区（H2 dev 取样实证，contains 最长键优先）——
      常减压: [炼油区]
      催化裂化: [炼油区]
      1#催化: [炼油区]
      1#联合装置: [炼油区]
      炼油三部: [炼油区]
      储罐区: [罐区]
      危化品仓库: [危化仓库]
      中央控制室: [特勤保障区]
      中央控制: [特勤保障区]
      中控室: [特勤保障区]
      消防队: [特勤保障区]
      消防泵房: [特勤保障区]
      指挥: [特勤保障区]
      装卸台: [装卸区]
      装车: [装卸区]
      卸车: [装卸区]
      液体装卸: [装卸区]
      码头: [码头区]
      周界: [全厂范围]
      厂区: [全厂范围]
      全厂区: [全厂范围]
      门: [全厂范围]
      动力站: [公用工程区]
      公用工程站: [公用工程区]
    aliases:
      水东港: 码头区
      水东港区: 码头区
      乙烯裂解: 乙烯区
